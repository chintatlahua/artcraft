<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArtCraft OS · Rafael</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1118">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1118;--bg2:#131822;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#d8e4f0;--dim:#6b7f95;--g:#00e5a0;--cy:#00c8e0;
  --mono:'JetBrains Mono',monospace;--sans:'DM Sans',sans-serif;--disp:'Bebas Neue',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;
  background-image:linear-gradient(rgba(0,229,160,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,.02) 1px,transparent 1px);background-size:52px 52px}
.wrap{max-width:1200px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:clamp(40px,8vw,52px);aspect-ratio:1;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--g),var(--cy));
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:clamp(24px,5vw,30px);color:#000}
h1{font-family:var(--disp);font-size:clamp(28px,6vw,42px);letter-spacing:clamp(2px,.6vw,4px);font-weight:400;line-height:1;
  background:linear-gradient(135deg,var(--g),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:var(--mono);font-size:clamp(9px,2.2vw,11px);color:var(--dim);letter-spacing:1.5px;margin-top:5px}
.search{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;color:var(--text);font:16px var(--sans)}
.search:focus{outline:2px solid var(--g);outline-offset:1px}
.group{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--dim);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.group::after{content:'';flex:1;height:1px;background:var(--border2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:clamp(10px,2vw,16px)}
.card{display:flex;gap:14px;align-items:flex-start;padding:16px;min-height:96px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  color:inherit;text-decoration:none;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .15s,border-color .15s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c);outline:none}
.icon{width:clamp(52px,12vw,64px);aspect-ratio:1;border-radius:14px;flex-shrink:0;object-fit:cover;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:30px;color:var(--c);border:1px solid var(--border2)}
.txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-family:var(--disp);font-size:clamp(22px,4.5vw,26px);letter-spacing:1.5px;color:var(--c);line-height:1.05}
.desc{font-size:13.5px;line-height:1.4}
.ver{font-family:var(--mono);font-size:10px;color:var(--dim)}
.empty{display:none;color:var(--dim);padding:20px 0}
@media (max-width:420px){.card{padding:14px;gap:12px}.desc{font-size:13px}}
@media (min-width:1000px){.card{padding:18px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">A</div><div><h1>ARTCRAFT OS</h1><div class="sub">APPS WEB EN GITHUB PAGES</div></div></header>
  <input class="search" id="q" type="search" placeholder="Buscar app…" aria-label="Buscar app" autocomplete="off">
  <div id="out"></div><p class="empty" id="empty">Ninguna app coincide con la búsqueda.</p>
</div>
<script>
// [nombre, descripción, carpeta en el repositorio, carpeta del ícono en getartcraft.com]
const GROUPS=[
 ['Diseño y publicación','#00e5a0',[
  ['PhotoCraft','Editor de imágenes.','photocraft-web-0.23.1','photocraft'],
  ['FontCraft','Texto con tus fuentes.','fontcraft-web-0.1.0','fontcraft'],
  ['DesignCraft','Maquetación y publicación de páginas.','designcraft-web-0.20.1','designcraft'],
  ['VectorCraft','Ilustración vectorial.','vectorcraft-web-0.24.1','vectorcraft'],
  ['FigCraft','Diseño de interfaces y prototipos.','figcraft-web-0.18.1','figcraft'],
  ['LightCraft','Biblioteca de fotos y revelado de raw.','lightcraft-web-0.21.1','lightcraft']]],
 ['Documentos','#3b9eff',[
  ['WordCraft','Procesador de texto.','wordcraft-web-0.18.1','wordcraft'],
  ['GridCraft','Hojas de cálculo y análisis de datos.','gridcraft-web-0.19.1','gridcraft'],
  ['DeckCraft','Presentaciones y diapositivas.','deckcraft-web-0.18.1','deckcraft'],
  ['PdfCraft','Lee, organiza, une, divide y protege PDF.','pdfcraft-web-0.21.1','pdfcraft']]],
 ['Video, audio y efectos','#ff7b3a',[
  ['FilmCraft','Edición de video profesional.','filmcraft-web-0.20.1','filmcraft'],
  ['EffectCraft','Motion graphics y efectos visuales.','effectcraft-web-0.24.1','effectcraft'],
  ['SoundCraft','Grabación, edición y mezcla de audio.','soundcraft-web-0.20.1','soundcraft']]],
 ['3D y otros','#9d6fff',[
  ['CADCraft','Diseño y dibujo asistido por computadora.','cadcraft-web-0.20.1','cadcraft'],
  ['MaterialCraft','Materiales procedurales por nodos.','materialcraft-web-0.4.1','materialcraft'],
  ['TextureCraft','Pintura de texturas 3D.','texturecraft-web-0.6.1','texturecraft'],
  ['Craft Anything','Explora cómo funciona el software y crea el tuyo.','craft-anything-web-0.6.1','craft-anything']]]];
const STANDALONE=matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const out=document.getElementById('out'),q=document.getElementById('q'),empty=document.getElementById('empty');
function render(f){f=(f||'').trim().toLowerCase();let n=0;out.innerHTML='';
 for(const [title,color,apps] of GROUPS){
  const list=apps.filter(a=>!f||(a[0]+' '+a[1]).toLowerCase().includes(f));if(!list.length)continue;n+=list.length;
  const h=document.createElement('div');h.className='group';h.textContent=title.toUpperCase();out.appendChild(h);
  const g=document.createElement('div');g.className='grid';
  for(const [name,desc,dir,ico] of list){
   const a=document.createElement('a');a.className='card';a.href=dir+'/';a.target='_blank';a.rel='noopener';a.style.setProperty('--c',color);
   const img=document.createElement('img');img.className='icon';img.alt='';img.loading='lazy';img.src='https://getartcraft.com/images/apps/'+ico+'/icon.webp';
   img.onerror=()=>{const d=document.createElement('div');d.className='icon';d.textContent=name[0];img.replaceWith(d)};
   const t=document.createElement('div');t.className='txt';
   const v=dir.match(/-([\d.]+)$/);
   t.innerHTML='<span class="name"></span><span class="desc"></span><span class="ver"></span>';
   t.children[0].textContent=name;t.children[1].textContent=desc;t.children[2].textContent=v?'v'+v[1]:'';
   a.append(img,t);g.appendChild(a);}
  out.appendChild(g);}
 empty.style.display=n?'none':'block';}
q.addEventListener('input',()=>render(q.value));render();
</script>
</body>
</html>
